  <style>
    .toast-message { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 15px 25px; border-radius: 30px; display: flex; align-items: center; gap: 20px; z-index: 100; box-shadow: 0 5px 20px rgba(0,0,0,0.5); transition: opacity 0.5s ease; }
    .close-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: none; opacity: 0.7; transition: opacity 0.3s; }
    .close-btn:hover { opacity: 1; color: #ffb347; }
    #skill-popup { position: absolute; left: 5vw; top: 50%; transform: translateY(-50%); max-width: 480px; padding: 2.5rem; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; z-index: 100; opacity: 0; pointer-events: none; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
    #close-popup-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; }
    .skill-row { margin-bottom: 12px; }
    .skill-label { display: flex; justify-content: space-between; font-size: 0.9rem; color: #eee; margin-bottom: 6px; font-weight: bold; letter-spacing: 1px;}
    .skill-bar-bg { width: 100%; background: rgba(255,255,255,0.1); height: 8px; border-radius: 4px; overflow: hidden; }
    .skill-bar-fill { height: 100%; border-radius: 4px; transition: width 1s cubic-bezier(0.16, 1, 0.3, 1); width: 0%; }
  </style>
</head>
